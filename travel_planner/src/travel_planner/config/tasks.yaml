destination_task:
  description: >
    Analyze user preferences, select the best destination, and partition the total
    budget across flights, hotel, and activities.

    USER PREFERENCES:
    - Origin: {origin}
    - Destination area: {destination}
    - Total budget: {budget} EUR
    - Age group: {age_group}
    - Departure date: {departure_date}
    - Return date: {return_date}
    - Check-in date: {checkin_date}
    - Check-out date: {checkout_date}
    - Adults: {adults}

    Your job is to:
      1. Analyze the user profile and preferences
      2. Select the BEST destination within the total budget
      3. Partition the total budget of {budget} EUR across the three categories:
           - Flights budget:    40-50% of {budget} EUR
           - Hotel budget:      35-45% of {budget} EUR
           - Activities budget: 10-20% of {budget} EUR
         Adjust percentages based on destination cost of living and travel style.
      4. Explicitly state the exact EUR amount assigned to each category
      5. Explain clearly WHY this destination and budget split are suitable

    IMPORTANT:
    - You must autonomously decide the destination
    - The budget split must be realistic for the chosen destination
    - Always output the three budget figures clearly so other agents can use them
    - Consider that hotel budget covers the FULL stay ({checkin_date} to {checkout_date})

  expected_output: >
    A complete destination recommendation including:
    - Selected city and country
    - Motivation of the choice
    - Budget allocation breakdown:
        * Flights budget:    [amount] EUR (for {adults} adults, round-trip)
        * Hotel budget:      [amount] EUR (total for full stay)
        * Activities budget: [amount] EUR (total for all activities)
        * Total: {budget} EUR
    - Short destination overview
  agent: travel_planner


flight_task:
  description: >
    Find round-trip flight options for the destination selected by the travel planner.
    You MUST stay within the flight budget allocated in the destination task.

    USER DATA:
    - Departure city: {origin}
    - Departure date: {departure_date}
    - Return date: {return_date}
    - Adults: {adults}
    - Total budget: {budget} EUR
    - Flight budget: read from the destination task output

    STEP-BY-STEP INSTRUCTIONS:

    1. Read the flight budget and destination from the destination task output.

    2. Format the city names correctly before calling the tool:
       - Use lowercase with country code: 'city_countrycode'
       - Europe examples : milan_it | rome_it | copenhagen_dk | berlin_de |
                           amsterdam_nl | paris_fr | stockholm_se | oslo_no |
                           warsaw_pl | vienna_at | lisbon_pt | barcelona_es
       - North America   : new-york_us | los-angeles_us | miami_us |
                           toronto_ca | montreal_ca | cancun_mx
       - Note: multi-word cities use a hyphen: 'new-york_us', 'los-angeles_us'

    3. Call the flight_search tool with the formatted city names.

    4. If the tool returns "No flights found":
       a. Try once more with an alternative format of the same city
          (e.g. if 'new_york_us' failed, retry with 'new-york_us').
       b. If still no results after the retry, output EXACTLY this line
          as the first line of your response:
          DESTINATION_CHANGE_REQUIRED: no flights found for [destination]
          Then list 2 alternative destinations in the same geographic area
          that are more likely to have direct or cheap connections from {origin}.
          Do NOT invent flight data.

    5. If flights are found:
       a. Select the best option within the flight budget.
       b. Calculate: price_per_person = tool_price / {adults}
                     total_price = tool_price (already for all adults if adults>1,
                     otherwise multiply by {adults}).
       c. Flag clearly if the option exceeds the budget.

    HARD RULES:
    - Never invent or estimate flight prices -- only use real tool output.
    - Never exceed the flight budget without explicitly flagging it.
    - Always show both price per person AND total for {adults} adults.

  expected_output: >
    ONE of the following two formats:

    FORMAT A -- Flights found:
      Origin      : [city_code]
      Destination : [city_code]
      Airline     : [name]
      Outbound    : [date] [time] [IATA src] to [IATA dst] ([duration])
      Return      : [date] [time] [IATA src] to [IATA dst] ([duration])
      Price/person: [X] EUR
      Total price : [X] EUR for {adults} adults
      Budget fit  : YES / NO -- [brief explanation]
      Book at     : [truncated link]

    FORMAT B -- No flights found (output this ONLY if tool returned no results after retry):
      DESTINATION_CHANGE_REQUIRED: no flights found for [destination]
      Alternative 1: [city, country] -- reason why it has better connections
      Alternative 2: [city, country] -- reason why it has better connections

  agent: flight_agent


hotel_task:
  description: >
    Find accommodation for the destination selected by the travel planner.
    You MUST stay within the hotel budget allocated in the destination task.

    HOW THE HOTEL SEARCH TOOL WORKS -- READ CAREFULLY:
    The hotel_search tool handles city resolution INTERNALLY in two automatic steps:
      Step 1 (automatic): calls Booking.com locations API with the city name
                          to obtain the internal dest_id code.
      Step 2 (automatic): uses that dest_id to search for available hotels,
                          running 3 searches sorted by price, popularity,
                          and review_score, then cross-references the results.
    YOU only need to pass the city name in English. Do NOT try to find or
    pass the dest_id yourself -- the tool does it automatically.

    USER DATA:
    - Check-in date: {checkin_date}
    - Check-out date: {checkout_date}
    - Adults: {adults}
    - Total budget: {budget} EUR
    - Hotel budget: read from the destination task output

    STEP-BY-STEP INSTRUCTIONS:
      1. Read the hotel budget and city name from the destination task output.
      2. Calculate max price per night: hotel_budget / number_of_nights.
      3. Call hotel_search passing:
           city_name  = city name in English (e.g. 'Copenhagen', 'Vancouver')
           check_in   = {checkin_date}
           check_out  = {checkout_date}
           adults     = {adults}
           rooms      = 1
           budget     = 'low' / 'medium' / 'high' based on the hotel budget
      4. The tool returns a BEST PICK recommendation already cross-referenced
         across price, popularity, and review score. Use it as your recommendation.
      5. Verify the total price is within the hotel budget.
         If it exceeds the budget, flag the overrun explicitly.

    IMPORTANT:
    - Pass city_name in English only (e.g. 'Copenhagen', not 'copenhagen_dk').
    - Never exceed the allocated hotel budget without flagging it.

  expected_output: >
    A hotel recommendation including:
    - Hotel name and star rating
    - Price per night and total cost for the full stay
    - Number of nights
    - Whether the total is within the allocated hotel budget
    - Address or neighbourhood
    - Review score and number of reviews
    - Why it was selected (based on cross-reference across price, popularity, reviews)
  agent: hotel_agent


activity_task:
  description: >
    Search for real attractions at the selected destination and suggest the best ones
    within the activities budget allocated in the destination task.

    HOW THE ATTRACTION SEARCH TOOL WORKS -- READ CAREFULLY:
    The attraction_search tool requires a Booking.com dest_id as input, NOT a city name.
    This dest_id is the same internal code used by the hotel search.

    TWO-STEP PROCESS YOU MUST FOLLOW:

      STEP 1 -- Get the dest_id:
        Look for the dest_id in the hotel task output. The hotel_search tool
        resolves it internally and may print it. If it is visible, use it.

        If the dest_id is NOT in the context, use this reference table:
          Copenhagen  -> -2745636    Stockholm   -> -2668537
          Amsterdam   -> -2140479    Paris       -> -1456928
          Berlin      -> -1746443    Rome        -> -126693
          Barcelona   -> -372490     Lisbon      -> -2167973
          Vienna      -> -1995499    Oslo        -> -2674061
          Prague      -> -553173     Budapest    -> -850553
          London      -> -2601889    Dublin      -> -1506909
          Vancouver   -> 1458        Toronto     -> 1268
          New York    -> 20088325    Miami       -> 20014181
          Los Angeles -> 20014183    Montreal    -> 20065951
          Cancun      -> 20034348

      STEP 2 -- Call attraction_search:
        Pass exactly these parameters:
          dest_id    = [dest_id from step 1]
          start_date = {departure_date}
          end_date   = {return_date}
          currency   = 'EUR'

    AFTER GETTING RESULTS:
      3. Suggest a mix of free and paid activities within the activities budget.
      4. Show cost per person AND total for {adults} adults.
      5. Track a running total -- do not exceed the activities budget.
      6. Include at least one free activity.
      7. If the API returns no structured data, use the simulated fallback
         from the tool output and label each activity as ESTIMATED.

    USER DATA:
    - Age group: {age_group}
    - Adults: {adults}
    - Activities budget: read from the destination task output
    - Travel dates: {departure_date} to {return_date}

    IMPORTANT:
    - Always call attraction_search first -- do not invent activities.
    - Activities must suit the user age group ({age_group}).

  expected_output: >
    A list of recommended activities including:
    - Activity or attraction name
    - Cost per person and total for {adults} adults
    - Running budget total after each activity
    - Whether the total is within the allocated activities budget
    - Short description and why it suits the user profile
    - Label each item: LIVE DATA or ESTIMATED
  agent: activity_agent


final_plan_task:
  description: >
    Create the FINAL COMPLETE TRAVEL PLAN by combining all outputs from the previous tasks.
    Verify that the sum of all costs does not exceed the total budget of {budget} EUR.

    NOTE: if the flight task output contains "DESTINATION_CHANGE_REQUIRED",
    use the alternative destination chosen by the subsequent agents for the final plan.

    You must:
      1. Collect outputs from destination_task, flight_task, hotel_task, activity_task
      2. Build a complete and well-structured travel plan
      3. Show a final budget reconciliation table:
           - Flights total:    [amount] EUR
           - Hotel total:      [amount] EUR
           - Activities total: [amount] EUR
           - GRAND TOTAL:      [amount] EUR  (must be <= {budget} EUR)
      4. If the grand total exceeds {budget} EUR, flag the overage clearly
         and suggest where to reduce costs
      5. Note any data limitations (e.g. flight prices not confirmed, activities estimated)

  expected_output: >
    A complete travel plan containing:
    1. Destination overview (note if changed from original selection)
    2. Flight information (real price if available, or budget estimate with note)
    3. Hotel information (name, stars, price/night, total stay cost, review score)
    4. Activities and attractions (list with costs, LIVE or ESTIMATED labels)
    5. Budget reconciliation:
         - Flights:    [X] EUR
         - Hotel:      [X] EUR
         - Activities: [X] EUR
         - TOTAL:      [X] EUR / {budget} EUR budget
    6. Final travel summary and personalized tips
  agent: travel_planner